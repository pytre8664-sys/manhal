<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول — منهل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="index.html" style="margin-bottom:20px">
        <span class="brand__mark">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </span>
        <span class="brand__text"><span class="brand__name">منهل</span><span class="brand__tag">MANHAL</span></span>
      </a>
      <h1 style="font-size:24px" data-i18n="auth.login.title">تسجيل الدخول</h1>
      <p class="small muted" data-i18n="auth.login.sub">أدخل بريدك الإلكتروني للمتابعة.</p>

      <form id="login-form" class="stack" style="gap:14px">
        <div class="field">
          <label class="field__label" for="email" data-i18n="auth.email">البريد الإلكتروني</label>
          <div class="input-icon">
            <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
            <input class="input" id="email" name="email" type="email" required placeholder="name@example.com" dir="ltr" />
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="password" data-i18n="auth.password">كلمة المرور</label>
          <div class="input-icon">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" id="password" name="password" type="password" required placeholder="••••••••" />
          </div>
        </div>
        <div class="row row--between">
          <label class="checkbox"><input type="checkbox" checked /><span>تذكّرني</span></label>
          <a class="small" href="#" data-i18n="auth.forgot">نسيت كلمة المرور؟</a>
        </div>
        <button class="btn btn--block btn--lg" type="submit" data-i18n="auth.login.title">تسجيل الدخول</button>
      </form>

      <div class="row" style="gap:10px;margin:16px 0">
        <hr class="divider" style="flex:1;margin:0" />
        <span class="tiny muted" data-i18n="auth.or">أو</span>
        <hr class="divider" style="flex:1;margin:0" />
      </div>
      <button class="btn btn--ghost btn--block" type="button" data-demo-login>
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/><path d="M3 12h18"/></svg>
        <span data-i18n="auth.google">المتابعة عبر Google</span>
      </button>

      <p class="small muted center" style="margin:20px 0 0">
        <span data-i18n="auth.noAccount">ليس لديك حساب؟</span>
        <a href="signup.html" data-i18n="auth.create">أنشئ حسابًا</a>
      </p>
      <div class="alert alert--info mt-md">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
        <span data-i18n="common.demoNotice">هذه بيانات تجريبية للعرض فقط.</span>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const role = localStorage.getItem("manhal.role") || "school";
      Manhal.setUser({ name: "مستخدم تجريبي", email: this.email.value, role: role });
      location.href = role === "parent" ? "dashboard-parent.html" : role === "teacher" ? "dashboard-teacher.html" : "dashboard-school.html";
    });
    document.querySelector("[data-demo-login]").addEventListener("click", function () {
      Manhal.setUser({ name: "مستخدم تجريبي", email: "demo@manhal.app", role: "school" });
      location.href = "dashboard-school.html";
    });
  </script>
</body>
</html>
