<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>طلب معلم عاجل — منهل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="section section--tight">
    <div class="container" style="max-width:820px">
      <div class="row" style="gap:8px;margin-bottom:10px">
        <span class="chip chip--urgent">
          <svg class="icon" viewBox="0 0 24 24"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8z"/></svg>
          <span data-i18n="urgent.badge">مسار سريع للمدارس</span>
        </span>
      </div>
      <h1 data-i18n="urgentForm.title">طلب معلم عاجل</h1>
      <p class="muted" data-i18n="urgentForm.sub">نموذج سريع — أقل من دقيقة. سيصل إشعار للمعلمين المطابقين فورًا.</p>

      <div class="card card--pad-lg mt-lg">
        <form data-demo-form data-redirect="dashboard-school.html" class="stack" style="gap:16px" id="urgent-form">
          <div class="form-grid">
            <div class="field">
              <label class="field__label" for="u-subject" data-i18n="urgentForm.subject">المادة المطلوبة</label>
              <select class="select" id="u-subject" required></select>
            </div>
            <div class="field">
              <label class="field__label" for="u-grade" data-i18n="urgentForm.grade">الصف</label>
              <select class="select" id="u-grade" required></select>
            </div>
            <div class="field">
              <label class="field__label" for="u-district" data-i18n="urgentForm.district">المنطقة</label>
              <select class="select" id="u-district" required></select>
            </div>
            <div class="field">
              <label class="field__label" for="u-mode" data-i18n="urgentForm.mode">نمط التدريس</label>
              <select class="select" id="u-mode"></select>
            </div>
            <div class="field">
              <label class="field__label" for="u-when" data-i18n="urgentForm.when">وقت الحاجة</label>
              <input class="input" id="u-when" type="text" placeholder="مثال: غدًا صباحًا / هذا الأسبوع" />
            </div>
            <div class="field">
              <label class="field__label" for="u-count">عدد الحصص <span class="muted">(اختياري)</span></label>
              <input class="input" id="u-count" type="number" min="1" placeholder="4" />
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="u-notes" data-i18n="urgentForm.notes">تفاصيل إضافية</label>
            <textarea class="textarea" id="u-notes" rows="4" placeholder="مثال: مطلوب معلم رياضيات للصف الثالث الثانوي، حصص مسائية، بدء فوري."></textarea>
          </div>
          <div class="alert alert--urgent">
            <svg class="icon" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
            <span data-i18n="urgentForm.note">يمكنك لاحقًا تحويل هذا الطلب إلى وظيفة كاملة مع المتطلبات والتفاصيل.</span>
          </div>
          <div class="row row--between row--wrap">
            <a class="btn btn--ghost" href="dashboard-school.html" data-i18n="common.notNow">ليس الآن</a>
            <button class="btn btn--urgent btn--lg" type="submit" data-i18n="urgentForm.submit">إرسال الطلب العاجل</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      function fill() {
        const lang = document.documentElement.lang === "en" ? "en" : "ar";
        const s = document.getElementById("u-subject");
        const g = document.getElementById("u-grade");
        const d = document.getElementById("u-district");
        const m = document.getElementById("u-mode");
        const cs = s.value, cg = g.value, cd = d.value, cm = m.value;
        s.innerHTML = SUBJECTS.map((x) => `<option value="${x.id}">${x[lang]}</option>`).join("");
        g.innerHTML = GRADES.map((x) => `<option value="${x.id}">${x[lang]}</option>`).join("");
        d.innerHTML = DISTRICTS.map((x) => `<option value="${x.id}">${x[lang]}</option>`).join("");
        m.innerHTML = MODES.map((x) => `<option value="${x.id}">${Manhal.t(x.key)}</option>`).join("");
        s.value = cs || "math"; g.value = cg || "secondary"; d.value = cd || "mukalla"; m.value = cm || "inperson";
      }
      fill();
      document.addEventListener("manhal:lang", fill);
    })();
  </script>
</body>
</html>
