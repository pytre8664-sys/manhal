<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تواصل معنا — منهل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="section">
    <div class="container" style="max-width:960px">
      <div class="section-head">
        <h1 data-i18n="footer.contact">تواصل معنا</h1>
        <p>سؤال عن المنصة، مشكلة في حسابك، أو اقتراح؟ اكتب لنا وسنعود إليك.</p>
      </div>

      <div class="grid grid-2" style="align-items:start">
        <div class="card card--pad-lg">
          <form data-demo-form data-success="تم استلام رسالتك، سنعاود التواصل معك قريبًا." class="stack" style="gap:14px">
            <div class="field">
              <label class="field__label" for="c-name" data-i18n="auth.name">الاسم الكامل</label>
              <input class="input" id="c-name" required />
            </div>
            <div class="field">
              <label class="field__label" for="c-email" data-i18n="auth.email">البريد الإلكتروني</label>
              <input class="input" id="c-email" type="email" required dir="ltr" />
            </div>
            <div class="field">
              <label class="field__label" for="c-subject">الموضوع</label>
              <select class="select" id="c-subject">
                <option>سؤال عام</option>
                <option>مشكلة تقنية</option>
                <option>توثيق حساب</option>
                <option>خصوصية البيانات</option>
                <option>شراكة أو تعاون</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="c-msg">الرسالة</label>
              <textarea class="textarea" id="c-msg" rows="5" required></textarea>
            </div>
            <button class="btn btn--block btn--lg" type="submit" data-i18n="common.submit">إرسال</button>
          </form>
        </div>

        <div class="stack" style="gap:14px">
          <div class="card">
            <div class="row" style="gap:10px">
              <span class="role-card__icon" style="width:40px;height:40px;margin:0"><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg></span>
              <div><div class="tiny muted">البريد الإلكتروني</div><strong class="small" dir="ltr">hello@manhal.app</strong></div>
            </div>
          </div>
          <div class="card">
            <div class="row" style="gap:10px">
              <span class="role-card__icon" style="width:40px;height:40px;margin:0"><svg class="icon" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></span>
              <div><div class="tiny muted">الهاتف</div><strong class="small" dir="ltr">+967 7XX XXX XXX</strong></div>
            </div>
          </div>
          <div class="card">
            <div class="row" style="gap:10px">
              <span class="role-card__icon" style="width:40px;height:40px;margin:0"><svg class="icon" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
              <div><div class="tiny muted">الموقع</div><strong class="small">المكلا — حضرموت، اليمن</strong></div>
            </div>
          </div>
          <div class="alert alert--info">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
            <span data-i18n="common.demoNotice">هذه بيانات تجريبية للعرض فقط.</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
