<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إنشاء حساب — منهل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="auth-wrap">
    <div class="auth-card" style="width:min(560px,100%)">
      <h1 style="font-size:24px" data-i18n="auth.signup.title">أنشئ حسابك</h1>
      <p class="small muted" data-i18n="auth.signup.sub">اختر دورك أولًا، ثم أكمل بياناتك.</p>

      <form id="signup-form" class="stack" style="gap:14px">
        <div class="field">
          <span class="field__label" data-i18n="auth.role">نوع الحساب</span>
          <div class="grid grid-3" style="gap:8px">
            <label class="card" style="padding:12px;display:flex;gap:8px;align-items:center;cursor:pointer">
              <input type="radio" name="role" value="school" checked style="accent-color:var(--primary)" />
              <span class="small" data-i18n="common.school">مدرسة</span>
            </label>
            <label class="card" style="padding:12px;display:flex;gap:8px;align-items:center;cursor:pointer">
              <input type="radio" name="role" value="parent" style="accent-color:var(--primary)" />
              <span class="small" data-i18n="common.parent">ولي أمر</span>
            </label>
            <label class="card" style="padding:12px;display:flex;gap:8px;align-items:center;cursor:pointer">
              <input type="radio" name="role" value="teacher" style="accent-color:var(--primary)" />
              <span class="small" data-i18n="common.teacher">معلم</span>
            </label>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="name" data-i18n="auth.name">الاسم الكامل</label>
          <input class="input" id="name" name="name" required />
        </div>
        <div class="form-grid">
          <div class="field">
            <label class="field__label" for="email" data-i18n="auth.email">البريد الإلكتروني</label>
            <input class="input" id="email" name="email" type="email" required dir="ltr" />
          </div>
          <div class="field">
            <label class="field__label" for="phone" data-i18n="auth.phone">رقم الجوال</label>
            <input class="input" id="phone" name="phone" type="tel" dir="ltr" placeholder="+967 7XX XXX XXX" />
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="password" data-i18n="auth.password">كلمة المرور</label>
          <input class="input" id="password" name="password" type="password" required minlength="8" />
          <span class="field__hint">8 أحرف على الأقل</span>
        </div>
        <label class="checkbox">
          <input type="checkbox" required />
          <span data-i18n="auth.terms">أوافق على شروط الاستخدام وسياسة الخصوصية.</span>
        </label>
        <button class="btn btn--block btn--lg" type="submit" data-i18n="auth.create">أنشئ حسابًا</button>
      </form>

      <div class="alert alert--info mt-md">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
        <span data-i18n="common.demoNotice">هذه بيانات تجريبية للعرض فقط.</span>
      </div>

      <p class="small muted center" style="margin:18px 0 0">
        <span data-i18n="auth.haveAccount">لديك حساب بالفعل؟</span>
        <a href="login.html" data-i18n="nav.login">تسجيل الدخول</a>
      </p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
